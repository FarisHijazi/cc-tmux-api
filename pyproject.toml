[project]
name = "cc-tmux-api"
version = "0.3.0"
description = "Local daemon that spawns, lists, kills, and schedules unattended Claude Code workers in tmux (with reboot revival)"
readme = "README.md"
authors = [
    { name = "Faris Hijazi", email = "theefaris@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pyyaml>=6.0",
    "uvicorn>=0.29",
]

[project.scripts]
cc-tmux-api = "cc_tmux_api.server:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
