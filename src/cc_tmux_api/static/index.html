<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-tmux-api — workers</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --dim: #8b949e; --green: #3fb950; --red: #f85149; --yellow: #d29922;
    --blue: #58a6ff; --accent: #1f6feb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 22px;
           border-bottom: 1px solid var(--border); position: sticky; top: 0;
           background: var(--bg); z-index: 5; }
  header h1 { font-size: 17px; margin: 0; }
  header .spacer { flex: 1; }
  header .sub, .sub { color: var(--dim); font-size: 12px; }
  main { max-width: 1200px; margin: 0 auto; padding: 18px 22px 60px; }
  h2.section-head { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); margin: 26px 0 10px; display: flex; align-items: baseline; gap: 8px; }
  .count { color: var(--dim); font-weight: 400; }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .card .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
                font-size: 12px; color: var(--dim); margin-bottom: 8px; }
  .badge { border: 1px solid var(--border); border-radius: 20px; padding: 1px 9px;
           font-size: 11px; }
  .badge.kind { color: var(--blue); border-color: var(--blue); }
  .badge.age { color: var(--yellow); border-color: var(--yellow); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { background: #21262d; color: var(--text); border: 1px solid var(--border);
           border-radius: 6px; padding: 5px 13px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button.danger:hover { border-color: var(--red); color: var(--red); }
  button.confirm { background: var(--red); border-color: var(--red); color: #fff; }
  input[type=text] { background: var(--bg); border: 1px solid var(--border);
           border-radius: 6px; color: var(--text); padding: 5px 10px;
           font-size: 13px; flex: 1; min-width: 180px; }
  a { color: var(--blue); text-decoration: none; }
  .empty { color: var(--dim); font-style: italic; padding: 6px 2px; }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px;
         background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  .row .rmain { flex: 1; min-width: 0; }
  .row .rmain .rtext { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .rbucket { color: var(--dim); font-size: 11px; }
  .term { background: #010409; border: 1px solid var(--border); border-radius: 6px;
          padding: 8px 10px; font: 11.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
          white-space: pre-wrap; word-break: break-word; max-height: 220px;
          overflow-y: auto; color: #c9d1d9; margin: 0 0 10px; direction: ltr; text-align: left; }
  .wdot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .wdot.working { background: var(--yellow); animation: pulse 1.2s infinite; }
  .wdot.waiting { background: var(--red); animation: pulse 1.2s infinite; }
  .wdot.idle { background: var(--green); }
  .wdot.done { background: var(--dim); }
  .wdot.unknown { background: var(--border); }
  @keyframes pulse { 50% { opacity: .35; } }
  .card.flash { animation: cardflash 2.2s ease-out; }
  @keyframes cardflash {
    0%, 15% { box-shadow: 0 0 0 2px var(--yellow), 0 0 22px 2px var(--yellow); }
    100% { box-shadow: none; }
  }
  .launch-form { display: flex; flex-direction: column; gap: 8px; }
  .launch-form textarea { background: var(--bg); border: 1px solid var(--border);
          border-radius: 6px; color: var(--text); padding: 8px 10px; font: 13px/1.5 inherit;
          min-height: 70px; resize: vertical; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
           background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
           padding: 9px 18px; z-index: 30; max-width: 80vw; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/cc-static/app.js"></script>
</body>
</html>
